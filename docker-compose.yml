services:

  # ── MySQL ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: poc-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password_poc
      MYSQL_DATABASE:      poc
      MYSQL_USER:          poc
      MYSQL_PASSWORD:      password_poc
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "poc", "-password_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── PHP / Apache ──────────────────────────────────────────
  app:
    build: .
    container_name: poc-app
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:     db
      DB_PORT:     3306
      DB_NAME:     poc
      DB_USER:     poc
      DB_PASSWORD: password_poc

      # ── ЮKassa ────────────────────────────────────────────
      # Получить в личном кабинете: https://yookassa.ru/my/api-keys
      # Для тестового режима ключ начинается с test_
      YUKASSA_SHOP_ID:  "516191"          # например: 123456
      YUKASSA_SECRET:   "test_*g3zWVT36FYvzxd3V0XAwgQkF0Z5naDu2c5BsZtr4vF9k"          # например: test_abc123...

      # Базовый URL сайта (без слеша в конце)
      # Нужен для формирования return_url после оплаты
      APP_URL: "http://144.31.157.82"   # например: https://yourdomain.com

    volumes:
      - ./www:/var/www/html
    restart: unless-stopped

volumes:
  db_data: